<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISE 8110 Online</title>
<style>
:root{--bg:#F7F2EA;--panel:#FFFFFF;--ink:#1C1626;--muted:#6A6274;--line:#E3D9CB;--gold:#FDB719;
  --title:"Bricolage Grotesque","Satoshi","Helvetica Neue",Arial,sans-serif;--body:"Aptos","Segoe UI","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141019;--panel:#1F1928;--ink:#F3EEE6;--muted:#B3AABD;--line:#362E41}}
:root[data-theme="dark"]{--bg:#141019;--panel:#1F1928;--ink:#F3EEE6;--muted:#B3AABD;--line:#362E41}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:56px}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px}
h1,h2{font-family:var(--title);font-weight:800;line-height:1.15;margin:0}
h1{font-size:clamp(28px,4vw,40px)}
p.lead{color:var(--muted);margin:8px 0 22px}
a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:14px 0;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--gold);outline:none}
a.card h2{font-size:24px;margin-bottom:6px}
a.card p{margin:0;color:var(--muted)}
.go{display:inline-block;margin-top:12px;background:var(--gold);color:#000;font-weight:700;border-radius:9px;padding:8px 16px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--gold);color:#000;padding:8px 22px;font-weight:700;font-size:14px}
</style>
</head>
<body>
<main class="wrap">
  <h1>ISE 8110 Online</h1>
  <p class="lead">Design of Experiments. Online activities and review materials.</p>
  <a class="card" href="exam1-review/">
    <h2>Exam 1 Review</h2>
    <p>Games to practice questions: The Case of the Light Candy Bags and Exam 1 Review: The Audit.</p>
    <span class="go">Open</span>
  </a>
</main>
<footer>ISE 8110 Design of Experiments</footer>
</body>
</html>
